<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Galaxy Fly-Through</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<canvas id="canvas" tabindex="0"></canvas>
	<pre id="overlay"></pre>
	<pre id="error" style="display:none"></pre>
	<pre id="help">
mouse click    free look (pointer lock), drag also works
WASD / arrows  fly forward / strafe
E / Q          up / down
Shift          boost speed x8
scroll         speed (0.5 pc/s to 600 pc/s)
[ / ]          exposure (how faint a star still shows)
R              reset position
  </pre>

	<!-- Runtime modules. Classic script tags, no modules (per AGENTS.md).
	     Order matters: math before render, render before stream, main last. -->
	<script src="math/hash.js"></script>
	<script src="math/density.js"></script>
	<script src="math/sampling.js"></script>
	<script src="math/star-record.js"></script>
	<script src="math/star-types.js"></script>
	<script src="math/nebula.js"></script>
	<script src="core/device.js"></script>
	<script src="core/camera.js"></script>
	<script src="core/input.js"></script>
	<script src="core/loop.js"></script>
	<!-- Order is the dependency order: a file may only read a namespace that an
	     earlier file registered. The tile stream feeds the renderer, so it loads
	     before it. -->
	<script src="render/shaders.js"></script>
	<script src="stream/tile-loader.js"></script>
	<script src="stream/cell-manager.js"></script>
	<script src="render/star-sprites.js"></script>
	<script src="main.js"></script>
</body>
</html>
